<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scene gallery · 场景一览</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    html, body { height: auto; overflow: auto; }
    body { background: #FFF7F2; padding: 20px; font-family: system-ui, sans-serif; color: #4A2E3A; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .hint { margin: 0 0 18px; font-size: 13px; color: #8C6A78; }
    .hint code { background: #fff; padding: 1px 5px; border-radius: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 18px; }
    .item h2 { margin: 0 0 6px; font-size: 15px; }
    .item h2 small { font-weight: 500; color: #8C6A78; }
    .g-box { position: relative; width: 100%; aspect-ratio: 2.4; overflow: hidden; border-radius: 12px; box-shadow: 0 6px 20px rgba(80, 40, 60, .15); }
    .g-box .scene { position: absolute; inset: 0; }
    .g-box .layer { left: 0; width: 100%; height: 100%; }
    .g-guide { position: absolute; inset: 0; pointer-events: none; }
    .no-guides .g-guide { display: none; }
    .big .grid { grid-template-columns: 1fr; }
  </style>
</head>
<body>
  <h1>Scene gallery · 场景一览</h1>
  <p class="hint">
    Dashed box = what a phone (portrait) shows · 虚线框 = 手机竖屏能看到的范围；粉色 = 情侣站的位置；灰色 = 手机上卡片盖住的区域。<br>
    URL options: <code>?only=park</code> <code>&amp;mood=night</code> <code>&amp;moods=1</code> (day/sunset/night) <code>&amp;lang=en</code> <code>&amp;skyline=shanghai</code> <code>&amp;season=autumn</code> <code>&amp;docks=1</code> <code>&amp;guides=0</code>
  </p>
  <div class="grid" id="grid"></div>

  <script>
    // settings from the URL go into TRIP_CONFIG before the scene scripts read it
    var Q = new URLSearchParams(location.search);
    window.TRIP_CONFIG = { lang: Q.get('lang') || 'zh-CN', skyline: Q.get('skyline') || 'generic' };
  </script>
  <script src="../js/art.js"></script>
  <script src="../js/scenes/park.js"></script>
  <script src="../js/scenes/cafe.js"></script>
  <script src="../js/scenes/museum.js"></script>
  <script src="../js/scenes/beach.js"></script>
  <script src="../js/scenes/amusement.js"></script>
  <script src="../js/scenes/bistro.js"></script>
  <script>
    (function () {
      var Art = window.TripArt, grid = document.getElementById('grid');
      var only = Q.get('only'), moods = Q.get('moods') === '1' ? ['day', 'sunset', 'night'] : [Q.get('mood') || ''];
      if (Q.get('guides') === '0') document.body.classList.add('no-guides');
      if (only) document.body.classList.add('big');
      function extraHTML(e) {
        return '<div class="fx ' + e.cls + '" style="left:' + (e.x / 24) + '%;top:' + (e.y / 10) + '%;width:' + (e.w / 24) + '%;height:' + (e.h / 10) + '%;' + (e.style || '') + '">' + e.html + '</div>';
      }
      var guides = '<svg class="g-guide" viewBox="0 0 2400 1000" preserveAspectRatio="none">' +
        '<rect x="969" y="0" width="462" height="330" fill="#888" opacity=".25"/>' +
        '<rect x="969" y="2" width="462" height="996" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="14 10"/>' +
        '<rect x="1060" y="450" width="280" height="370" rx="60" fill="#FF6FA0" opacity=".28"/>' +
        '<line x1="0" y1="820" x2="2400" y2="820" stroke="#FF6FA0" stroke-width="2" stroke-dasharray="8 8" opacity=".6"/></svg>';
      var names = only ? only.split(',') : Object.keys(Art.scenes);
      names.forEach(function (name, n) {
        moods.forEach(function (mood, m) {
          var item = document.createElement('div');
          item.className = 'item';
          var box = document.createElement('div');
          box.className = 'g-box';
          item.innerHTML = '<h2>' + name + (mood ? ' <small>mood: ' + mood + '</small>' : '') + '</h2>';
          item.appendChild(box);
          grid.appendChild(item);
          var fn = Art.scenes[name];
          if (!fn) { box.textContent = 'missing scene: ' + name; return; }
          var sc = { mood: mood || undefined, season: Q.get('season') || undefined, docks: Q.get('docks') ? Q.get('docks') === '1' : undefined };
          var art;
          try { art = fn('g' + n + '_' + m + '-', sc); } catch (err) { box.textContent = 'error: ' + err.message; console.error(err); return; }
          var back = document.createElement('div'), front = document.createElement('div');
          back.className = 'scene scene-back is-here bg-' + name;
          front.className = 'scene scene-front is-here bg-' + name;
          back.style.background = art.sky;
          art.layers.forEach(function (L) {
            var el = document.createElement('div');
            el.className = 'layer' + (L.prop ? ' prop' : '');
            el.innerHTML = (L.svg ? '<svg viewBox="0 0 2400 1000" preserveAspectRatio="none" aria-hidden="true">' + L.svg + '</svg>' : '') + (L.extras || []).map(extraHTML).join('');
            (L.front ? front : back).appendChild(el);
          });
          box.appendChild(back);
          box.insertAdjacentHTML('beforeend', guides);
          box.appendChild(front);
          var fit = function () { var s = box.clientHeight / 1000; [back, front].forEach(function (sc) { sc.querySelectorAll('.layer').forEach(function (l) { l.style.fontSize = (s * 100) + 'px'; }); }); };
          fit(); window.addEventListener('resize', fit);
        });
      });
    })();
  </script>
</body>
</html>
